# Local Postgres only. Start with: pnpm db:up
# The password is read from .env.local and is not stored in this file.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: mbevents
    volumes:
      - mb_events_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb -d mbevents"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mb_events_pg:
