kind = "web"
previewPath = "/"
title = "MB Events"
description = "A responsive public website for MB Events with event discovery and an inquiry funnel for customers planning weddings, mitzvahs, parties, and corporate events."
version = "1.0.0"
id = "artifacts/mb-events"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21947

[services.development]
run = "pnpm --filter @workspace/mb-events run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mb-events", "run", "build" ]
serve = "static"
publicDir = "artifacts/mb-events/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21947"
BASE_PATH = "/"
