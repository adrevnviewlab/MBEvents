openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Public event inquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit an event inquiry
      description: Saves a public event inquiry for MB Events follow-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Inquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReceipt"
        "400":
          description: Invalid inquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadInput:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        eventType:
          type: string
          enum:
            - Wedding
            - Sweet 16
            - Quinceañera
            - Bar Mitzvah
            - Bat Mitzvah
            - Birthday
            - Corporate
            - School Event
            - Private Party
            - Other
        eventDate:
          type: ["string", "null"]
          format: date
        eventDateUnknown:
          type: boolean
        guestCount:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5000
        venueName:
          type: ["string", "null"]
          maxLength: 160
        services:
          type: array
          maxItems: 12
          items:
            type: string
            enum:
              - DJ
              - MC
              - Lighting
              - Dancers / Party Motivators
              - Photo Booth
              - Video
              - Event Coordination
              - Karaoke
              - Casino Events
              - Not sure yet
        message:
          type: ["string", "null"]
          maxLength: 2000
        source:
          type: string
          enum:
            - website_builder
            - date_check
            - venue_finder
      required:
        - firstName
        - lastName
        - email
        - phone
        - eventType
        - eventDate
        - eventDateUnknown
        - guestCount
        - venueName
        - services
        - message
        - source
    LeadReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [received]
        createdAt:
          type: string
          format: date-time
      required: [id, status, createdAt]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

